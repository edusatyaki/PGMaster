<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PG Master &mdash; PostgreSQL Function Reference</title>
<meta name="description" content="__COUNT__ PostgreSQL functions. Every result on this page was produced by running the query against PostgreSQL __PGVERSION__.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------- ink & paper */
:root {
    --paper:    #fbf9f5;
    --sheet:    #ffffff;
    --tint:     #f3efe7;
    --ink:      #1b1c1e;
    --ink-2:    #55585e;
    --ink-3:    #8b8e94;
    --rule:     #ddd8cd;
    --rule-2:   #ebe6dc;
    --accent:   #2a5d86;
    --accent-2: #9c3b28;
    --green:    #2f6b41;
    --bar-h:    54px;
    --foot-h:   40px;
    --serif: 'IBM Plex Serif', Georgia, serif;
    --sans:  'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono:  'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
html[data-theme="dark"] {
    --paper:    #17181b;
    --sheet:    #1c1e22;
    --tint:     #212429;
    --ink:      #e6e4df;
    --ink-2:    #a2a49f;
    --ink-3:    #74767b;
    --rule:     #33363c;
    --rule-2:   #26292e;
    --accent:   #7fb0d4;
    --accent-2: #d69078;
    --green:    #7fb98f;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.5;
    font-size: 15px;
    padding-bottom: var(--foot-h);
    -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
::selection { background: var(--tint); }

/* ---------------------------------------------------------------- masthead bar */
.bar {
    position: sticky; top: 0; z-index: 60;
    height: var(--bar-h);
    display: flex; align-items: center; gap: 18px;
    padding: 0 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
}
.wordmark {
    font-family: var(--serif); font-weight: 600; font-size: 1.12rem;
    letter-spacing: -0.01em; white-space: nowrap; color: var(--ink);
}
.wordmark em { font-style: normal; color: var(--accent); }

.find { position: relative; flex: 1; max-width: 460px; }
#q {
    width: 100%; height: 32px;
    padding: 0 52px 0 11px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    background: var(--sheet);
    color: var(--ink);
    font-family: var(--mono); font-size: 0.82rem;
}
#q::placeholder { color: var(--ink-3); }
#q:focus { outline: none; border-color: var(--accent); }
.slash {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 0.68rem; color: var(--ink-3);
    border: 1px solid var(--rule); border-radius: 2px; padding: 0 5px; pointer-events: none;
}
.tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.tool {
    width: 28px; height: 28px; display: grid; place-items: center;
    border: 1px solid var(--rule); border-radius: 2px;
    background: var(--sheet); color: var(--ink-2); cursor: pointer;
}
.tool:hover { color: var(--accent); border-color: var(--accent); }
.tool:disabled { opacity: 0.35; cursor: default; }
.tool:disabled:hover { color: var(--ink-2); border-color: var(--rule); }
html:not([data-theme="dark"]) .i-moon, html[data-theme="dark"] .i-sun { display: none; }
.i-fsx { display: none; }
html.fs .i-fs { display: none; }
html.fs .i-fsx { display: block; }

/* ---------------------------------------------------------------- page frame */
.frame {
    display: grid;
    grid-template-columns: 214px minmax(0, 1fr);
    max-width: 1240px;
    margin: 0 auto;
    align-items: start;
}
.frame > * { min-width: 0; }

/* ---------------------------------------------------------------- contents rail */
.rail {
    position: sticky; top: var(--bar-h);
    max-height: calc(100vh - var(--bar-h) - var(--foot-h));
    overflow-y: auto;
    padding: 26px 18px 30px 20px;
    border-right: 1px solid var(--rule);
    scrollbar-width: thin;
}
.rail::-webkit-scrollbar { width: 5px; }
.rail::-webkit-scrollbar-thumb { background: var(--rule); }

.rail-h {
    font-family: var(--mono); font-size: 0.63rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px;
}
.tally { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-2); margin-bottom: 6px; }
.tally b { color: var(--ink); font-weight: 600; }
.tally-bar { height: 2px; background: var(--rule); margin-bottom: 8px; }
.tally-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.4s ease; }
.clear { font-family: var(--sans); font-size: 0.72rem; color: var(--ink-3); background: none; border: none; padding: 0; cursor: pointer; }
.clear:hover { color: var(--accent-2); text-decoration: underline; }

.toc { margin-top: 26px; }
.toc a {
    display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: baseline;
    padding: 3px 0 3px 8px; margin-left: -10px;
    border-left: 2px solid transparent;
    color: var(--ink-2); font-size: 0.82rem; line-height: 1.35;
}
.toc a:hover { color: var(--ink); text-decoration: none; }
.toc a.on { border-left-color: var(--accent); color: var(--ink); font-weight: 500; }
.toc .no { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-3); }
.toc a.on .no { color: var(--accent); }
.toc .qty { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- title block */
.sheet { padding: 0 34px; }
.masthead { padding: 46px 0 18px; border-bottom: 2px solid var(--ink); }
.masthead h1 {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(1.9rem, 3.6vw, 2.5rem); letter-spacing: -0.02em; line-height: 1.12;
}
.masthead .sub { font-size: 1rem; color: var(--ink-2); margin-top: 7px; }
.colophon {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    font-family: var(--mono); font-size: 0.73rem; color: var(--ink-2);
    padding-top: 10px;
}
.colophon .sep { color: var(--rule); }
.colophon .run { color: var(--green); }
.filter-note { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-3); padding-top: 12px; }

/* ---------------------------------------------------------------- entries */
.part { padding-top: 28px; }
.part-h {
    position: sticky; top: var(--bar-h); z-index: 20;
    display: flex; align-items: baseline; gap: 11px;
    padding: 9px 0 7px;
    background: var(--paper);
    border-bottom: 1px solid var(--ink);
}
.part-h .no { font-family: var(--mono); font-size: 0.76rem; color: var(--accent); font-weight: 500; }
.part-h h2 { font-family: var(--serif); font-size: 1.12rem; font-weight: 600; letter-spacing: -0.01em; }
.part-h .qty { margin-left: auto; font-family: var(--mono); font-size: 0.72rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.entry {
    display: grid;
    grid-template-columns: 258px minmax(0, 1fr) 22px;
    gap: 0 22px;
    align-items: baseline;
    padding: 9px 6px 9px 0;
    border-bottom: 1px solid var(--rule-2);
    cursor: pointer;
}
.entry:hover { background: var(--tint); }
.entry:hover .nm { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.entry.kb { background: var(--tint); box-shadow: inset 2px 0 0 var(--accent); }
.nm { font-family: var(--mono); font-size: 0.85rem; font-weight: 600; color: var(--ink); word-break: break-word; }
.sg { font-family: var(--mono); font-size: 0.7rem; color: var(--ink-3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ds { font-size: 0.84rem; color: var(--ink-2); }
.mk {
    width: 13px; height: 13px; align-self: center;
    border: 1px solid var(--rule); border-radius: 1px;
    background: var(--sheet); cursor: pointer;
    font-family: var(--mono); font-size: 10px; line-height: 1;
    color: transparent; padding: 0;
}
.mk:hover { border-color: var(--green); }
.entry.done .mk { color: var(--green); border-color: var(--green); }
.entry.done .nm, .entry.done .ds { color: var(--ink-3); }
.hidden { display: none !important; }

.nothing { padding: 60px 0; color: var(--ink-2); font-size: 0.9rem; }
.nothing code { font-family: var(--mono); color: var(--accent); }

/* ---------------------------------------------------------------- foot */
footer.foot {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    height: var(--foot-h);
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 0 20px;
    background: var(--paper);
    border-top: 1px solid var(--rule);
    font-family: var(--mono); font-size: 0.71rem; color: var(--ink-3);
    white-space: nowrap; overflow: hidden;
}
footer.foot .sep { color: var(--rule); }

/* ---------------------------------------------------------------- reading pane */
.veil { position: fixed; inset: 0; background: rgba(24, 22, 18, 0.42); opacity: 0; pointer-events: none; transition: opacity 0.18s; z-index: 90; }
.veil.on { opacity: 1; pointer-events: auto; }
.pane {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 100;
    width: min(720px, 100vw);
    background: var(--paper);
    border-left: 1px solid var(--ink);
    display: flex; flex-direction: column;
    transform: translateX(101%);
    transition: transform 0.22s ease-out;
}
.pane.on { transform: none; }

.pane-h {
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px; height: var(--bar-h); flex-shrink: 0;
    border-bottom: 1px solid var(--rule);
}
.pane-h .where { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-3); }

.pane-b { flex: 1; overflow-y: auto; padding: 26px 30px 56px; }
.pane-b::-webkit-scrollbar { width: 8px; }
.pane-b::-webkit-scrollbar-thumb { background: var(--rule); }

.fn-name { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; word-break: break-word; }
.fn-sig {
    font-family: var(--mono); font-size: 0.8rem; color: var(--ink-2);
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    padding: 9px 0; margin-top: 12px; overflow-x: auto; white-space: nowrap;
}
.fn-note { font-size: 0.94rem; color: var(--ink-2); margin-top: 14px; line-height: 1.62; max-width: 62ch; }

.part-lbl {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 0.63rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-3);
    margin: 28px 0 9px;
}
.part-lbl .fill { flex: 1; height: 1px; background: var(--rule); }
.dupe {
    font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
    border: 1px solid var(--rule); border-radius: 2px; background: var(--sheet);
    color: var(--ink-3); padding: 2px 7px; cursor: pointer;
}
.dupe:hover { color: var(--accent); border-color: var(--accent); }

pre.src {
    font-family: var(--mono); font-size: 0.79rem; line-height: 1.6;
    background: var(--sheet); color: var(--ink);
    border: 1px solid var(--rule);
    border-left: 2px solid var(--accent);
    padding: 12px 14px; white-space: pre-wrap; overflow-x: auto;
}
pre.src.pre { border-left-color: var(--rule); color: var(--ink-2); font-size: 0.74rem; }

.given { display: flex; flex-wrap: wrap; gap: 16px; }
.given > div { flex: 1; min-width: 240px; }
.given-h { font-family: var(--mono); font-size: 0.71rem; color: var(--ink-2); margin-bottom: 5px; }
.xscroll { overflow-x: auto; border: 1px solid var(--rule); background: var(--sheet); }

table.grid { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.74rem; }
table.grid th {
    text-align: left; padding: 6px 10px; white-space: nowrap;
    color: var(--ink-2); font-weight: 600;
    border-bottom: 3px double var(--rule);
}
table.grid td { padding: 5px 10px; border-top: 1px solid var(--rule-2); white-space: nowrap; vertical-align: top; font-variant-numeric: tabular-nums; }
table.grid td.wrap { white-space: pre-wrap; word-break: break-word; min-width: 240px; }
table.grid i.nil { color: var(--ink-3); font-style: italic; }

.out { border: 1px solid var(--rule); background: var(--sheet); }
.out .xscroll { border: none; }
.tally-out { padding: 5px 10px; font-family: var(--mono); font-size: 0.68rem; color: var(--ink-3); border-top: 1px solid var(--rule-2); }
.said { font-family: var(--mono); font-size: 0.76rem; color: var(--green); padding: 9px 11px; white-space: pre-wrap; }
.unrun { font-size: 0.82rem; color: var(--ink-2); padding: 10px 12px; line-height: 1.6; border-left: 2px solid var(--accent-2); }
.unrun b { color: var(--accent-2); font-weight: 600; }
.shifts { font-family: var(--mono); font-size: 0.7rem; color: var(--accent-2); margin-top: 8px; }
.waiting { font-family: var(--mono); font-size: 0.74rem; color: var(--ink-3); padding: 10px 12px; }

.mark-row { margin-top: 28px; padding-top: 15px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 12px; }
.mark {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--rule); border-radius: 2px; background: var(--sheet);
    color: var(--ink-2); padding: 6px 13px; cursor: pointer;
    font-family: var(--sans); font-size: 0.82rem;
}
.mark:hover { border-color: var(--green); color: var(--green); }
.mark.on { border-color: var(--green); color: var(--green); background: var(--tint); }
.keys { margin-left: auto; font-family: var(--mono); font-size: 0.68rem; color: var(--ink-3); }

/* syntax, set for print rather than for a terminal */
.k { color: var(--accent); font-weight: 600; }
.s { color: var(--accent-2); }
.n { color: var(--green); }
.c { color: var(--ink-3); font-style: italic; }

/* ---------------------------------------------------------------- narrow */
@media (max-width: 1000px) {
    .frame { grid-template-columns: minmax(0, 1fr); }
    .rail {
        position: sticky; top: var(--bar-h); z-index: 30;
        max-height: none; overflow: visible;
        padding: 0; border-right: none; border-bottom: 1px solid var(--rule);
        background: var(--paper);
    }
    .rail-h, .tally, .tally-bar, .clear { display: none; }
    .toc { margin: 0; display: flex; overflow-x: auto; scrollbar-width: none; }
    .toc::-webkit-scrollbar { display: none; }
    .toc a {
        display: flex; gap: 6px; white-space: nowrap; margin: 0;
        padding: 9px 13px; border-left: none; border-bottom: 2px solid transparent;
        font-size: 0.8rem;
    }
    .toc a.on { border-left: none; border-bottom-color: var(--accent); }
    .toc .qty { display: none; }
    .sheet { padding: 0 20px; }
    .part-h { top: calc(var(--bar-h) + 38px); }
    .masthead { padding: 30px 0 16px; }
}
@media (max-width: 680px) {
    .bar { gap: 11px; padding: 0 14px; }
    .slash { display: none; }
    .sheet { padding: 0 14px; }
    .entry { grid-template-columns: minmax(0, 1fr) 22px; gap: 0 12px; }
    .entry .ds { grid-column: 1; margin-top: 4px; }
    .entry .mk { grid-row: 1; grid-column: 2; }
    .pane { width: 100vw; border-left: none; }
    .pane-b { padding: 18px 16px 46px; }
    .fn-name { font-size: 1.24rem; }
}
@media (max-width: 480px) {
    .wordmark { display: none; }
}
</style>
</head>
<body>

<div class="bar">
    <span class="wordmark">PG&nbsp;<em>Master</em></span>
    <div class="find">
        <input id="q" type="text" placeholder="search &hellip;" autocomplete="off" spellcheck="false">
        <span class="slash">/</span>
    </div>
    <div class="tools">
        <button class="tool" id="fs-btn" title="Fullscreen (F)" aria-label="Toggle fullscreen">
            <svg class="i-fs" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            <svg class="i-fsx" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3a2 2 0 0 0 2-2V3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M21 16h-3a2 2 0 0 0-2 2v3"/></svg>
        </button>
        <button class="tool" id="theme-btn" title="Light / dark" aria-label="Toggle theme">
            <svg class="i-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
        </button>
        <a class="tool" href="https://github.com/edusatyaki/PGMaster" target="_blank" rel="noopener" title="Source" aria-label="Source on GitHub">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.34c-2.23.48-2.7-1.07-2.7-1.07-.36-.93-.89-1.18-.89-1.18-.73-.5.05-.49.05-.49.8.06 1.23.83 1.23.83.72 1.23 1.88.88 2.34.67.07-.52.28-.88.51-1.08-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
        </a>
    </div>
</div>

<div class="frame">
    <aside class="rail">
        <div class="rail-h">Progress</div>
        <div class="tally"><b id="tally-n">0</b> of __COUNT__ read</div>
        <div class="tally-bar"><i id="tally-bar"></i></div>
        <button class="clear" id="clear-btn">clear</button>
        <nav class="toc" id="toc"></nav>
    </aside>

    <main class="sheet">
        <div class="masthead">
            <h1>PostgreSQL Function Reference</h1>
            <div class="sub">Every built-in function, with the output it actually produces.</div>
            <div class="colophon">
                <span>__COUNT__ entries</span><span class="sep">|</span>
                <span>21 sections</span><span class="sep">|</span>
                <span class="run">every result below was produced by running the query on PostgreSQL __PGVERSION__</span>
            </div>
        </div>

        <div class="filter-note" id="note"></div>
        <div id="parts"></div>
        <div class="nothing hidden" id="nothing">Nothing matches <code id="nothing-q"></code>.</div>
    </main>
</div>

<footer class="foot">
    <span>Satyaki Das</span><span class="sep">|</span><span>PG Master v2</span>
</footer>

<div class="veil" id="veil"></div>
<aside class="pane" id="pane" role="dialog" aria-modal="true" aria-label="Function detail">
    <div class="pane-h">
        <span class="where" id="where"></span>
        <div class="tools">
            <button class="tool" id="prev-btn" title="Previous" aria-label="Previous">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="tool" id="next-btn" title="Next" aria-label="Next">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button class="tool" id="shut-btn" title="Close (Esc)" aria-label="Close">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
    </div>
    <div class="pane-b" id="pane-b"></div>
</aside>

<script>
const DATA = __PAYLOAD__;
const NIL = "⟪NULL⟫";
const FN = DATA.funcs;
const CATS = DATA.cats;
const NO = {}, NAME = {};
CATS.forEach((c, i) => { NO[c.id] = String(i + 1).padStart(2, '0'); NAME[c.id] = c.label.replace(/^\d+\.\s*/, ''); });

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const keyOf = f => 'pg-v1-' + f.c + '-' + f.n;

/* ------------------------------------------------------------------- theme */
const saved = localStorage.getItem('pg-theme');
document.documentElement.dataset.theme = saved
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
$('#theme-btn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('pg-theme', next);
});

/* -------------------------------------------------------------- fullscreen */
const fsGo = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
const fsStop = document.exitFullscreen || document.webkitExitFullscreen;
const fsNow = () => document.fullscreenElement || document.webkitFullscreenElement;
function fullscreen() {
    if (!fsGo) return;
    const p = fsNow() ? fsStop.call(document) : fsGo.call(document.documentElement);
    if (p && p.catch) p.catch(() => {});
}
function fsSync() { document.documentElement.classList.toggle('fs', !!fsNow()); }
if (!fsGo) $('#fs-btn').style.display = 'none';
$('#fs-btn').addEventListener('click', fullscreen);
document.addEventListener('fullscreenchange', fsSync);
document.addEventListener('webkitfullscreenchange', fsSync);

/* ------------------------------------------------------------- highlighting */
const WORDS = ['SELECT','FROM','WHERE','GROUP BY','HAVING','ORDER BY','LIMIT','OFFSET','INSERT INTO','VALUES','UPDATE','SET','DELETE','CREATE TABLE','CREATE FUNCTION','CREATE PROCEDURE','CREATE TRIGGER','CREATE INDEX','CREATE VIEW','CREATE TYPE','CREATE SEQUENCE','ALTER TABLE','DROP TABLE','TRUNCATE','JOIN','INNER JOIN','LEFT JOIN','RIGHT JOIN','FULL OUTER JOIN','LATERAL','ON','AS','DISTINCT','BETWEEN','AND','OR','NOT','IN','LIKE','ILIKE','SIMILAR TO','IS NULL','IS NOT NULL','IS DISTINCT FROM','IS NOT DISTINCT FROM','UNION','EXCEPT','INTERSECT','EXISTS','CASE','WHEN','THEN','ELSE','END','PRIMARY KEY','FOREIGN KEY','REFERENCES','DEFAULT','WITH','WITHIN GROUP','FILTER','OVER','PARTITION BY','ROWS BETWEEN','RANGE','GROUPS','UNBOUNDED PRECEDING','CURRENT ROW','UNBOUNDED FOLLOWING','WINDOW','ORDINALITY','ROWS FROM','RETURNING','ON CONFLICT','DO UPDATE','EXCLUDED','GENERATED ALWAYS AS IDENTITY','LANGUAGE','RETURNS','RETURN','BEGIN','DECLARE','IF','ELSIF','CALL','EXECUTE FUNCTION','FOR EACH ROW','FOR EACH STATEMENT','AFTER','BEFORE','EXPLAIN','ANALYZE','VACUUM','GRANT','REVOKE','COMMIT','ROLLBACK','CAST','ASC','DESC','NULLS LAST','NULLS FIRST','VARIADIC','ROLLUP','CUBE','GROUPING SETS','PASSING','COLUMNS','PLACING','FOR','ARRAY','ROW','TRUE','FALSE','NULL','INTERVAL','TIMESTAMP','TIMESTAMPTZ','DATE','TIME','NUMERIC','INTEGER','BIGINT','TEXT','BOOLEAN','SERIAL','AT TIME ZONE','OVERLAPS','ANY','ALL','SOME','IMMUTABLE','STABLE'];
const WORD_RE = new RegExp('\\b(' + WORDS.slice().sort((a, b) => b.length - a.length)
    .map(k => k.replace(/ /g, '\\s+')).join('|') + ')\\b', 'gi');

function hl(str) {
    let out = esc(str);
    const held = [];
    const hold = h => { held.push(h); return 'QQ' + (held.length - 1) + 'QQ'; };
    out = out.replace(/--[^\n]*/g, m => hold('<span class="c">' + m + '</span>'));
    out = out.replace(/\$\$/g, m => hold('<span class="s">' + m + '</span>'));
    out = out.replace(/'(?:[^']|'')*'/g, m => hold('<span class="s">' + m + '</span>'));
    out = out.replace(WORD_RE, m => '<span class="k">' + m + '</span>');
    out = out.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="n">$1</span>');
    return out.replace(/QQ(\d+)QQ/g, (_, i) => held[+i]);
}

/* ------------------------------------------------------------------ results */
function grid(head, rows) {
    const h = head.map(x => '<th>' + esc(x) + '</th>').join('');
    const r = rows.map(row => '<tr>' + row.map(d => {
        if (d === NIL) return '<td><i class="nil">null</i></td>';
        if (d === '') return '<td></td>';
        const w = (d.length > 52 || d.indexOf('\n') >= 0) ? ' class="wrap"' : '';
        return '<td' + w + '>' + esc(d) + '</td>';
    }).join('') + '</tr>').join('');
    return '<div class="xscroll"><table class="grid"><thead><tr>' + h + '</tr></thead><tbody>' + r + '</tbody></table></div>';
}

function result(o) {
    if (o.x) return '<div class="out"><div class="unrun"><b>Not executed.</b> ' + esc(o.m) + '</div></div>';
    if (o.m !== undefined) return '<div class="out"><div class="said">' + esc(o.m) + '</div></div>';
    let h = '<div class="out">';
    if (o.p) h += o.p.map(l => '<div class="said">' + esc(l) + '</div>').join('');
    h += grid(o.h, o.r);
    h += '<div class="tally-out">(' + o.r.length + ' row' + (o.r.length === 1 ? '' : 's') + ')</div></div>';
    return h;
}

const T_EMP = '<div><div class="given-h">employees</div>' + grid(
    ['id', 'name', 'dept_id', 'salary', 'hire_date', 'email'],
    [['1', 'Alice', '101', '70000', '2019-03-15', 'alice@corp.io'],
     ['2', 'Bob', '102', '85000', '2020-07-01', 'bob@corp.io'],
     ['3', 'Charlie', '101', '60000', '2021-11-23', 'charlie@corp.io'],
     ['4', 'Diana', '102', '92000', '2018-01-09', 'diana@corp.io'],
     ['5', 'Evan', NIL, '55000', '2022-05-30', NIL]]) + '</div>';
const T_DEPT = '<div><div class="given-h">departments</div>' + grid(
    ['dept_id', 'dept_name'], [['101', 'IT'], ['102', 'Sales'], ['103', 'HR']]) + '</div>';

/* -------------------------------------------------------------------- build */
const read = new Set();
FN.forEach(f => { if (localStorage.getItem(keyOf(f)) === 'true') read.add(keyOf(f)); });

function build() {
    const count = {};
    FN.forEach(f => count[f.c] = (count[f.c] || 0) + 1);

    $('#toc').innerHTML = CATS.map(c =>
        '<a href="#part-' + c.id + '" data-cat="' + c.id + '">' +
        '<span class="no">' + NO[c.id] + '</span>' +
        '<span>' + esc(NAME[c.id]) + '</span>' +
        '<span class="qty">' + (count[c.id] || 0) + '</span></a>').join('');

    $('#parts').innerHTML = CATS.map(c => {
        const rows = [];
        FN.forEach((f, i) => {
            if (f.c !== c.id) return;
            rows.push(
                '<div class="entry' + (read.has(keyOf(f)) ? ' done' : '') + '" data-i="' + i + '" ' +
                'data-s="' + esc((f.n + ' ' + f.g + ' ' + f.d).toLowerCase()) + '">' +
                '<div><div class="nm">' + esc(f.n) + '</div><div class="sg">' + esc(f.g) + '</div></div>' +
                '<div class="ds">' + esc(f.d) + '</div>' +
                '<button class="mk" data-mk="' + i + '" title="Mark as read" aria-label="Mark as read">&#10003;</button>' +
                '</div>');
        });
        return '<section class="part" id="part-' + c.id + '" data-cat="' + c.id + '">' +
            '<div class="part-h"><span class="no">' + NO[c.id] + '</span>' +
            '<h2>' + esc(NAME[c.id]) + '</h2>' +
            '<span class="qty">' + rows.length + '</span></div>' + rows.join('') + '</section>';
    }).join('');
}

/* ----------------------------------------------------------------- progress */
function tally() {
    $('#tally-n').textContent = read.size;
    $('#tally-bar').style.width = (100 * read.size / FN.length) + '%';
}
function mark(i) {
    const f = FN[i], k = keyOf(f), on = !read.has(k);
    if (on) { read.add(k); localStorage.setItem(k, 'true'); }
    else { read.delete(k); localStorage.removeItem(k); }
    document.querySelectorAll('.entry[data-i="' + i + '"]').forEach(el => el.classList.toggle('done', on));
    const b = $('#mark-btn');
    if (b && +b.dataset.i === i) {
        b.classList.toggle('on', on);
        b.querySelector('span').textContent = on ? 'Read' : 'Mark as read';
    }
    tally();
}

/* ------------------------------------------------------------------- filter */
let shown = [];
function filter() {
    const q = $('#q').value.trim().toLowerCase();
    shown = [];
    document.querySelectorAll('.part').forEach(part => {
        let n = 0;
        part.querySelectorAll('.entry').forEach(e => {
            const ok = !q || e.dataset.s.includes(q);
            e.classList.toggle('hidden', !ok);
            if (ok) { n++; shown.push(+e.dataset.i); }
        });
        part.classList.toggle('hidden', n === 0);
        if (n) part.querySelector('.part-h .qty').textContent = n;
    });
    document.querySelectorAll('.toc a').forEach(a =>
        a.classList.toggle('hidden', document.getElementById('part-' + a.dataset.cat).classList.contains('hidden')));
    $('#note').textContent = q ? shown.length + ' of ' + FN.length + ' entries match "' + q + '"' : '';
    $('#nothing').classList.toggle('hidden', shown.length > 0);
    $('#nothing-q').textContent = q;
    pick(-1);
}

/* ------------------------------------------------------------- reading pane */
let at = -1, turn = 0;
function openEntry(i) {
    at = i;
    const f = FN[i];
    $('#where').textContent = '§' + NO[f.c] + '  ' + NAME[f.c];

    const all = f.q + ' ' + (f.s || '');
    const emp = /\bemployees\b/.test(all), dept = /\bdepartments\b/.test(all);

    let h = '<div class="fn-name">' + esc(f.n) + '</div>' +
            '<div class="fn-sig">' + esc(f.g) + '</div>' +
            '<div class="fn-note">' + esc(f.d) + '</div>';

    if (emp || dept) {
        h += '<div class="part-lbl">Given<span class="fill"></span></div>' +
             '<div class="given">' + (emp ? T_EMP : '') + (dept ? T_DEPT : '') + '</div>';
    }
    if (f.s) {
        h += '<div class="part-lbl">Setup<span class="fill"></span></div>' +
             '<pre class="src pre">' + hl(f.s) + '</pre>';
    }
    h += '<div class="part-lbl">Query<span class="fill"></span><button class="dupe" id="dupe-btn">copy</button></div>' +
         '<pre class="src">' + hl(f.q) + '</pre>' +
         '<div class="part-lbl">Result<span class="fill"></span></div>' +
         '<div id="slot"><div class="out"><div class="waiting">running &hellip;</div></div></div>' +
         (f.v ? '<div class="shifts">volatile &mdash; this value differs on every call</div>' : '');

    const done = read.has(keyOf(f));
    h += '<div class="mark-row"><button class="mark' + (done ? ' on' : '') + '" id="mark-btn" data-i="' + i + '">' +
         '<span>' + (done ? 'Read' : 'Mark as read') + '</span></button>' +
         '<span class="keys">&larr; &rarr; browse &nbsp;&middot;&nbsp; esc close</span></div>';

    const b = $('#pane-b');
    b.innerHTML = h;
    b.scrollTop = 0;
    $('#veil').classList.add('on');
    $('#pane').classList.add('on');

    const p = shown.indexOf(i);
    $('#prev-btn').disabled = p <= 0;
    $('#next-btn').disabled = p < 0 || p >= shown.length - 1;

    const t = ++turn;
    setTimeout(() => {
        if (t !== turn) return;
        const slot = document.getElementById('slot');
        if (slot) slot.innerHTML = result(f.o);
    }, 170);
}
function shut() { turn++; at = -1; $('#veil').classList.remove('on'); $('#pane').classList.remove('on'); }
function hop(d) {
    const p = shown.indexOf(at);
    if (p < 0) return;
    const n = p + d;
    if (n < 0 || n >= shown.length) return;
    openEntry(shown[n]);
}

/* ----------------------------------------------------------------- keyboard */
let cur = -1;
function pick(n) {
    document.querySelectorAll('.entry.kb').forEach(e => e.classList.remove('kb'));
    cur = n;
    if (n < 0 || n >= shown.length) return;
    const e = document.querySelector('.entry[data-i="' + shown[n] + '"]');
    if (e) { e.classList.add('kb'); e.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
}

document.addEventListener('keydown', e => {
    const typing = e.target.tagName === 'INPUT';
    if (e.key === 'Escape') {
        if ($('#pane').classList.contains('on')) shut();
        else if (typing) { e.target.value = ''; filter(); e.target.blur(); }
        return;
    }
    if (!typing && (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey)))) {
        e.preventDefault(); $('#q').focus(); $('#q').select(); return;
    }
    if (!typing && (e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.altKey) {
        e.preventDefault(); fullscreen(); return;
    }
    if ($('#pane').classList.contains('on')) {
        if (e.key === 'ArrowLeft') { e.preventDefault(); hop(-1); }
        if (e.key === 'ArrowRight') { e.preventDefault(); hop(1); }
        return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); pick(Math.min(cur + 1, shown.length - 1)); }
    if (e.key === 'ArrowUp') { e.preventDefault(); pick(Math.max(cur - 1, 0)); }
    if (e.key === 'Enter' && cur >= 0) { e.preventDefault(); openEntry(shown[cur]); }
});

/* ------------------------------------------------------------------- wiring */
$('#parts').addEventListener('click', e => {
    const m = e.target.closest('.mk');
    if (m) { e.stopPropagation(); mark(+m.dataset.mk); return; }
    const row = e.target.closest('.entry');
    if (row) openEntry(+row.dataset.i);
});
$('#pane-b').addEventListener('click', e => {
    const mb = e.target.closest('#mark-btn');
    if (mb) { mark(+mb.dataset.i); return; }
    const cp = e.target.closest('#dupe-btn');
    if (cp && at >= 0) {
        navigator.clipboard.writeText(FN[at].q).then(() => {
            cp.textContent = 'copied';
            setTimeout(() => { cp.textContent = 'copy'; }, 1300);
        }).catch(() => { cp.textContent = 'ctrl+c'; });
    }
});
$('#q').addEventListener('input', filter);
$('#veil').addEventListener('click', shut);
$('#shut-btn').addEventListener('click', shut);
$('#prev-btn').addEventListener('click', () => hop(-1));
$('#next-btn').addEventListener('click', () => hop(1));
$('#clear-btn').addEventListener('click', () => {
    if (!read.size || !confirm('Clear the ' + read.size + ' entries marked as read?')) return;
    read.forEach(k => localStorage.removeItem(k));
    read.clear();
    document.querySelectorAll('.entry.done').forEach(e => e.classList.remove('done'));
    tally();
});

/* --------------------------------------------------------------- where am i */
function spy() {
    const links = [...document.querySelectorAll('.toc a')];
    const barH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--bar-h'));
    let queued = false, was = null;
    function look() {
        queued = false;
        const line = barH + 22;
        let id = null;
        document.querySelectorAll('.part:not(.hidden)').forEach(p => {
            if (p.getBoundingClientRect().top <= line) id = p.dataset.cat;
        });
        if (!id) { const f = document.querySelector('.part:not(.hidden)'); id = f ? f.dataset.cat : null; }
        if (id === was) return;
        was = id;
        links.forEach(a => a.classList.toggle('on', a.dataset.cat === id));
        if (innerWidth <= 1000) {
            const on = links.find(a => a.dataset.cat === id);
            if (on) on.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
        }
    }
    addEventListener('scroll', () => { if (!queued) { queued = true; requestAnimationFrame(look); } }, { passive: true });
    addEventListener('resize', look, { passive: true });
    look();
}

build();
tally();
filter();
spy();
</script>
</body>
</html>
